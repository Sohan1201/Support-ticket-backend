services:
  postgres:
    image: postgres:17
    container_name: support-ticket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: support_tickets
    ports:
      - "5432:5432"
    volumes:
      - support_ticket_pgdata:/var/lib/postgresql/data

volumes:
  support_ticket_pgdata: